name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # Pinned lower bound + latest minor: the command-registry's
        # introspection (discord_webapi/commands/bridge.py) depends on how
        # discord.py stores Parameter/annotation internals, which has
        # shifted across minor releases before. This matrix is the CI-side
        # guard for that regression class (see tests/unit/test_bridge.py).
        discord-py-version: ["2.4.0", "latest"]

    services:
      # Match tests/*/test_*_multidb.py and conftest.py's default
      # connection strings exactly so no extra env wiring is needed here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dwa_test
          POSTGRES_PASSWORD: dwa_test
          POSTGRES_DB: dwa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: dwa_test
          MYSQL_USER: dwa_test
          MYSQL_PASSWORD: dwa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Pin discord.py version under test
        if: matrix.discord-py-version != 'latest'
        run: pip install "discord.py==${{ matrix.discord-py-version }}"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy discord_webapi

      - name: Pytest
        run: pytest --tb=short
