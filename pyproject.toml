[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-webapi"
version = "0.1.0"
description = "FastAPI + discord.py glue for building Discord bot web dashboards: OAuth2 login, guild-role authorization, and a live bot-to-dashboard command bridge."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cruciblelab" }]
keywords = ["discord", "discord.py", "fastapi", "dashboard", "oauth2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "discord.py>=2.4,<3",
  "pydantic>=2.0",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
# discord_webapi.storage.sql works against any SQLAlchemy AsyncEngine --
# these extras just get the right async DBAPI driver installed. Pick the
# one(s) matching your database; `sql` pulls in all three for convenience.
sql-sqlite = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20"]
sql-postgres = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29"]
sql-mysql = ["sqlalchemy[asyncio]>=2.0", "aiomysql>=0.2"]
sql = ["discord-webapi[sql-sqlite,sql-postgres,sql-mysql]"]
redis = ["redis>=5.0"]
# `packaging` is only needed to evaluate a third-party extension's declared
# `discord_webapi_requires` version specifier at discovery time. Without it
# the extension system still works -- the compatibility check just reports
# "not checked" instead of blocking an incompatible extension.
extensions = ["packaging>=23.0"]
# discord_webapi.captcha is a thin re-export of the standalone
# `webapi-captcha` package (https://github.com/cruciblelab/web-api-captcha,
# Apache-2.0) -- captcha/human-verification was split out into its own
# library so it can be developed and used independently of discord-webapi.
# Installed straight from GitHub for now (not yet on PyPI); pin to a tag or
# commit yourself if you need reproducible installs.
captcha = ["webapi-captcha[render] @ git+https://github.com/cruciblelab/web-api-captcha"]
# discord_webapi.observability.prometheus.PrometheusMetricsSink -- optional,
# opt-in production metrics (transport RPC latency, job/escalation/command
# counters). Nothing else in the library imports prometheus_client.
metrics = ["prometheus-client>=0.20"]
all = ["discord-webapi[sql,redis,extensions,captcha,metrics]"]
dev = [
  "discord-webapi[all]",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
# Scaffold a new third-party extension package skeleton.
discord-webapi-scaffold = "discord_webapi.extensions.scaffold:main"
# Move discord-webapi's SQL data from one database to another (needs the
# `sql` extra installed for whichever DBAPI driver(s) --from/--to require).
discord-webapi-migrate = "discord_webapi.tools.migrate:main"
# Create/list/restore a standalone (full, guild-scoped, or date-scoped)
# backup file, independent of any migration.
discord-webapi-backup = "discord_webapi.tools.backup:main"
# Check that the database (and optionally Redis / an HTTP endpoint) are
# reachable; exits 0/1 for cron/monitoring use. Redis check needs the
# `redis` extra installed.
discord-webapi-healthcheck = "discord_webapi.tools.healthcheck:main"

[project.urls]
Repository = "https://github.com/cruciblelab/discord-webapi"

[tool.hatch.metadata]
# The `captcha` extra points at webapi-captcha via a direct git URL
# (not yet on PyPI) -- hatchling refuses direct references in
# optional-dependencies unless this is explicitly opted into.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["discord_webapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Security() are meant to be called in argument
# defaults — that's the framework's own dependency-injection idiom, not a
# mutable-default-argument bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["discord_webapi"]
